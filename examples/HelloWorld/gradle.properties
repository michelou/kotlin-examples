appGroup=org.example
appVersion=1.0-SNAPSHOT

# https://docs.gradle.org/current/userguide/build_environment.html#sec:gradle_configuration_properties
# org.gradle.priority=normal (low,normal)
# org.gradle.parallel=true (true, false)
# org.gradle.projectcachedir=(.gradle)
# org.gradle.warning.mode=summary (all,fail,summary,none)
org.gradle.caching=true
org.gradle.caching.debug=false
org.gradle.configuration-cache=true
org.gradle.daemon=false

# https://mvnrepository.com/artifact/org.jetbrains.dokka/dokka-gradle-plugin
dokkaVersion=2.2.0

# https://mvnrepository.com/artifact/org.jetbrains.kotlin/kotlin-compiler
kotlinVersion=2.4.0

# https://mvnrepository.com/artifact/org.jetbrains.kotlinx/kotlinx-coroutines-core
kotlinxVersion=1.11.0

# https://mvnrepository.com/artifact/org.jetbrains.kotlinx/kotlinx-html-jvm
kotlinxHtmlVersion=0.12.0

# https://mvnrepository.com/artifact/junit/junit
junitVersion=4.13.2

# https://mvnrepository.com/artifact/io.gitlab.arturbosch.detekt/detekt-cli
detektVersion=1.23.8

mainClassName=org.example.main.HelloWorldKt
javaMainClassName=

# https://docs.gradle.org/current/userguide/build_environment.html
org.gradle.warning.mode=all

# migrating to Dokka Gradle plugin V2
org.jetbrains.dokka.experimental.gradle.pluginMode=V2EnabledWithHelpers
 