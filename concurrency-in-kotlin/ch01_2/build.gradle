plugins {
    id "checkstyle"
    id "java"
    id "org.jetbrains.dokka" version "$dokkaVersion"
    id "org.jetbrains.kotlin.jvm" version "$kotlinVersion"
    id "io.gitlab.arturbosch.detekt" version "$detektVersion"
}

group = "$appGroup"
version = "$appVersion"

description = """Kotlin/JVM code example"""

apply from: "../common.gradle"

sourceSets {
    // Default: srcDirs "src/main/kotlin"
	main.kotlin.srcDirs "src/main/kotlin"
}
// Default: buildDir = "build"
buildDir = "target"

ext {
    ktLintOpts = [
        "--reporter=plain",
        "--reporter=checkstyle,output=$buildDir\\ktlint-report.xml"
    ]
}

task lint(type: JavaExec) {
    description = "Analyze Kotlin source files with KtLint"
    mainClass = "-jar"
    args files("$ktLintJar") + ktLintOpts + sourceSets.main.allSource.files
}

checkstyle {
    maxErrors = 10
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

compileKotlin {
    // dependsOn lint

    kotlinOptions {
        // Tool options
        // suppressWarnings = true
        // verbose = false
        // Common options
        apiVersion = "2.2"  // "1.5"
        languageVersion = "2.2"  // "1.5"
        // JVM options
        jvmTarget = "17"  // "11", "1.8"
    }
}

task run(type: JavaExec) {
    dependsOn compileKotlin
    description = "Execute Kotlin main class $mainClassName"
    classpath sourceSets.main.runtimeClasspath
    mainClass = mainClassName
    args ""
}

repositories {
    mavenCentral()
}

dependencies {
    implementation("org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion")
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-core:$kotlinxVersion")
    testImplementation("org.jetbrains.kotlin:kotlin-test-junit:$kotlinVersion")
    api("junit:junit:$junitVersion")
    testImplementation("junit:junit:$junitVersion")
}
